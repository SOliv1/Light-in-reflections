[build]
  command = "npm install && npm run build"
  publish = "build"

[build.environment]
  CI = "false"
  REACT_APP_API_BASE_URL = "https://reflections-hcjq.onrender.com"
  # EmailJS — set real values in Netlify dashboard → Site settings → Environment variables
  # REACT_APP_EMAILJS_SERVICE_ID  = "your_service_id"
  # REACT_APP_EMAILJS_TEMPLATE_ID = "your_template_id"
  # REACT_APP_EMAILJS_PUBLIC_KEY  = "your_public_key"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
